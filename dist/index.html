<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050608" />
    <meta
      name="description"
      content="幻核动漫专注人工智能短剧制作与广告商单制作，从创意策划到成片交付一站完成。"
    />
    <title>幻核动漫｜人工智能短剧与广告制作</title>
    <link rel="icon" href="assets/logo.webp" type="image/webp" />
    <link rel="preload" href="fonts/GeistPixel-Circle.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <div class="page">
      <div class="bg" aria-hidden="true">
        <video class="bg-video" autoplay muted loop playsinline>
          <source
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260809_012548_ef22562c-c0ae-4816-ad9d-f8922af4e6a7.mp4"
            type="video/mp4"
          />
        </video>
        <div class="bg-shade"></div>
        <div class="bg-grain"></div>
      </div>

      <header class="site-header">
        <div class="header-inner">
          <a class="logo-button" href="#home" aria-label="幻核动漫首页">
            <img src="assets/logo.webp" alt="" width="52" height="52" />
          </a>

          <nav class="desktop-nav" aria-label="主导航">
            <a class="active" href="#home">首页</a>
            <a href="#capabilities">服务</a>
            <a href="#proof">案例</a>
            <a href="mailto:contact@huanhe-animation.cn">联系</a>
          </nav>

          <a class="desktop-contact" href="mailto:contact@huanhe-animation.cn?subject=%E5%90%88%E4%BD%9C%E5%92%A8%E8%AF%A2">洽谈合作</a>

          <button class="menu-toggle" type="button" aria-label="打开导航菜单" aria-expanded="false" aria-controls="mobile-menu">
            <span></span><span></span><span></span>
          </button>
        </div>
      </header>

      <main class="hero" id="home">
        <div class="hero-inner">
          <div class="trust-row anim" id="capabilities" style="--d: 0.05s">
            <div class="skill-badge badge-one"><span>剧</span></div>
            <div class="skill-badge badge-two"><span>广</span></div>
            <div class="skill-badge badge-three"><span>制</span></div>
            <div class="trust-pill">短剧与广告一体化制作</div>
          </div>

          <h1 class="headline">
            <span>让想象，</span>
            <span>直接开拍</span>
          </h1>

          <p class="subhead anim" style="--d: 0.28s">
            幻核动漫专注<span>人工智能短剧制作</span>与<span>广告商单制作</span>，从创意策划、角色开发到镜头生成与成片交付，让好故事更快抵达观众。
          </p>

          <a class="primary-cta anim" style="--d: 0.4s" href="mailto:contact@huanhe-animation.cn?subject=%E5%B9%BB%E6%A0%B8%E5%8A%A8%E6%BC%AB%E5%90%88%E4%BD%9C%E5%92%A8%E8%AF%A2">
            开始合作
            <span aria-hidden="true">↗</span>
          </a>
        </div>
      </main>

      <footer class="stats" id="proof" aria-label="制作能力">
        <div class="stat anim" style="--d: 0.5s">
          <span class="stat-symbol">◆</span>
          <strong><span class="count" data-target="120" data-decimals="0">0</span><span class="suffix">＋</span></strong>
          <small>项目交付</small>
        </div>
        <div class="stat anim" style="--d: 0.58s">
          <span class="stat-symbol">◎</span>
          <strong><span class="count" data-target="12" data-decimals="0">0</span><span class="suffix">道</span></strong>
          <small>标准流程</small>
        </div>
        <div class="stat anim" style="--d: 0.66s">
          <span class="stat-symbol">✦</span>
          <strong><span class="count" data-target="24" data-decimals="0">0</span><span class="suffix">小时</span></strong>
          <small>快速响应</small>
        </div>
        <div class="stat anim" style="--d: 0.74s">
          <span class="stat-symbol">▦</span>
          <strong><span class="count" data-target="30" data-decimals="0">0</span><span class="suffix">＋</span></strong>
          <small>题材覆盖</small>
        </div>
      </footer>
    </div>

    <div class="mobile-menu" id="mobile-menu" hidden>
      <button class="menu-overlay" type="button" aria-label="关闭导航菜单"></button>
      <nav class="menu-sheet" aria-label="移动导航">
        <a class="active" href="#home">首页</a>
        <a href="#capabilities">服务</a>
        <a href="#proof">案例</a>
        <a href="mailto:contact@huanhe-animation.cn">联系</a>
        <a class="menu-contact" href="mailto:contact@huanhe-animation.cn?subject=%E5%90%88%E4%BD%9C%E5%92%A8%E8%AF%A2">洽谈合作</a>
      </nav>
    </div>
  </body>
</html>
